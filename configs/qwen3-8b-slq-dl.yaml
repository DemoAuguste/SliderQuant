# SLQ P1 配置: Qwen3-8B DL 搜索 (EAR>=0.985, 温度 0.6)
model: /opt/zh/train/model_from_hf/qwen3_hf
net: qwen3
use_bfloat16: true
group_mode: split
group_size: 128
symmetric: false
bits_list: [3, 4, 5, 6, 7, 8]
