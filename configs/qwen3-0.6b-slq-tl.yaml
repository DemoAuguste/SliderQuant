# SLQ P0 配置: Qwen3-0.6B TL 搜索 (恢复率>=99%)
# 用法: python main_slq.py --config ... --mode tl   (自动跑 BF16+anchor 两个 benchmark)
model: /opt/zh/train/model_from_hf/qwen3_0_6b
net: qwen3
use_bfloat16: true
group_mode: split
group_size: 128
symmetric: false
bits_list: [3, 4, 5, 6, 7, 8]
anchor_bits: 4
tl_calib_bits: 6          # TL 单点标定用 uniform-6 (0.6B 上 4-bit KL=0.29 偏离线性区太远)
topk: 10
nsamples: 128
sens_nsamples: 64
seqlen: 2048
calib_dataset: wikitext2
cache_dir: /opt/zh/train/SliderQuant/cache
seed: 2
dl_target_ear: 0.99
tl_target_recovery: 0.99
eval_tasks: piqa,arc_easy,arc_challenge,boolq,hellaswag,winogrande
lm_eval_batch_size: 8
